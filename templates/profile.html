{% extends 'base.html' %}

{% block title %}User Profile - TruthLens AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <!-- Header -->
            <div class="glass-card p-4 mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold fs-3" style="width: 60px; height: 60px;">
                        {{ user.username[0]|upper }}
                    </div>
                    <div>
                        <h3 class="fw-bold text-white mb-1">{{ user.full_name or user.username }}</h3>
                        <p class="text-secondary small mb-0">
                            <span class="badge bg-secondary me-2">{{ user.role|upper }}</span>
                            Member since {{ user.created_at.strftime('%B %Y') }}
                        </p>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Update Profile Details -->
                <div class="col-md-6">
                    <div class="glass-card p-4 h-100">
                        <h5 class="fw-bold text-white mb-3"><i class="fas fa-user-gear me-2 text-info"></i> Account Details</h5>
                        
                        <form method="POST" action="{{ url_for('profile') }}">
                            <input type="hidden" name="action" value="update_profile">
                            
                            <div class="mb-3">
                                <label class="form-label text-secondary small fw-medium">Username (Read Only)</label>
                                <input type="text" class="form-control bg-dark text-secondary" value="{{ user.username }}" readonly disabled>
                            </div>
                            
                            <div class="mb-3">
                                <label for="full_name" class="form-label text-secondary small fw-medium">Full Name</label>
                                <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user.full_name }}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="email" class="form-label text-secondary small fw-medium">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="bio" class="form-label text-secondary small fw-medium">Short Bio / Organization</label>
                                <textarea class="form-control" id="bio" name="bio" rows="3" placeholder="e.g. Media Analyst / Research Fellow">{{ user.bio or '' }}</textarea>
                            </div>
                            
                            <button type="submit" class="btn btn-gradient-primary rounded-pill px-4">
                                <i class="fas fa-save me-2"></i> Update Profile
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Security / Change Password -->
                <div class="col-md-6">
                    <div class="glass-card p-4 h-100">
                        <h5 class="fw-bold text-white mb-3"><i class="fas fa-key me-2 text-warning"></i> Change Password</h5>
                        
                        <form method="POST" action="{{ url_for('profile') }}">
                            <input type="hidden" name="action" value="change_password">
                            
                            <div class="mb-3">
                                <label for="current_password" class="form-label text-secondary small fw-medium">Current Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="current_password" name="current_password" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="current_password">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="new_password" class="form-label text-secondary small fw-medium">New Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="new_password" name="new_password" minlength="6" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="new_password">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label for="confirm_new_password" class="form-label text-secondary small fw-medium">Confirm New Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="confirm_new_password" name="confirm_new_password" minlength="6" required>
                                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirm_new_password">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-outline-warning rounded-pill px-4">
                                <i class="fas fa-shield-halved me-2"></i> Change Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
