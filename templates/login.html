{% extends 'base.html' %}

{% block title %}Log In - TruthLens AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="glass-card p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-20 text-info d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="fas fa-right-to-bracket fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Welcome Back</h3>
                    <p class="text-secondary small">Log in to access your dashboard and news verification tools</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary small fw-medium">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username or email" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small fw-medium">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary border-opacity-25 text-secondary"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient-primary w-100 py-2.5 mb-3">
                        <i class="fas fa-sign-in-alt me-2"></i> Log In
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                    <span class="text-secondary small">Don't have an account yet? </span>
                    <a href="{{ url_for('register') }}" class="text-info fw-semibold text-decoration-none small">Register now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
